services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: techrescue
      POSTGRES_USER: techrescue
      POSTGRES_PASSWORD: techrescue
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techrescue -d techrescue"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
